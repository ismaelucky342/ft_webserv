server {
    listen 8080;
	server_name localhost;

    root ./www/sitio1;
    index index.html;

    error_page 400 /errors/400.html;
    error_page 404 /errors/404.html;
    error_page 403 /errors/403.html;
    error_page 500 /errors/500.html;
}

server {
    listen 8080;
    listen 192.168.1.89:8282;

    root ./www/sitio2;
    index index.html;

    error_page 400 /errors/400.html; //IMP: Los error pages tambien irán en locations según nginx. Eso evitaŕa tener que duplicar la carpeta de error dentro de cada "sitio" dentro de www, porque con location podemos redefinir su propio root. Nota aclaratoria: Si un location tiene root se busca en ere root, si no lo tiene se una el roor del bloque server.
    error_page 404 /errors/500.html; //IMP: Cambiar el 404 por 500. Lo he cambiado solo para comprobar que funcionaba cada uno con si config.
    error_page 403 /errors/403.html;
    error_page 500 /errors/404.html; //IMP: Cambiar el 500 por 404. Lo he cambiado solo para comprobar que funcionaba cada uno con si config.

    location /images {
	    root ./www/images;
	    autoindex on;
	    methods GET;
	}

	location /upload {
	    methods POST;
	    upload_store ./uploads;
	}
	
	location /old {
	    return 301 /new;
	}
	

	location /cgi-bin {
	    root ./cgi-bin;
	    methods GET POST;
	    cgi .py /usr/bin/python3;
	}
	
	location /docs {
	    root ./documentation;
	    index home.html;
	}

}