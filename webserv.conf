server {
	listen localhost:8080;
	server_name privado;

	root ./www/sitio2;
	index index.html;

	error_page 400 /errors/400.html;
	error_page 404 /errors/404.html;
	error_page 403 /errors/403.html;
	error_page 500 /errors/500.html;
}

server {
	listen 8080;
	server_name publico;

	root ./www/sitio1;
	index index.html;

	error_page 400 /errors/400.html;
	error_page 404 /errors/404.html;
	error_page 403 /errors/403.html;
	error_page 500 /errors/500.html;

	location / {
		methods GET;
	}

	location /images {
		root ./www/sitio1/images;
		autoindex on;
		methods GET;
	}

	location /upload {
		methods POST;
		upload_store ./uploads;
	}

	location /images/miguel {
		root ./www/sitio1/images;
		autoindex on;
		methods GET;
	}
	
	location /old {
		return 301 /new;
	}

	location /old.html {
		return 301 /new.html;
	}
	
	location /cgi-bin {
		root ./cgi-bin;
		methods GET POST;
		cgi .py /usr/bin/python3;
	}
	
	location /docs {
		root ./documentation;
		index home.html;
	}

}